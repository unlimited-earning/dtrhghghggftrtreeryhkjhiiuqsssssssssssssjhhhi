<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Main Admin - Sub Admin Approval Panel</title>

  <!-- Google Fonts & Firebase Compatibility SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL STYLES & GLASSMORPHISM THEME
       ========================================================================== */
    :root {
      --bg-dark: #060911;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px;
      position: relative;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Ambient Glow Backgrounds */
    .glow-bg {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(139, 92, 246, 0.1); top: -80px; left: -80px; }
    .glow-2 { width: 350px; height: 350px; background: rgba(16, 185, 129, 0.08); bottom: -80px; right: -80px; }

    /* Layout Wrapper */
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Toast Container */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      background: rgba(22, 30, 49, 0.96);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      pointer-events: auto;
      animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .toast.success { border-left: 4px solid var(--primary); }
    .toast.error { border-left: 4px solid var(--danger); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Navbar Header */
    .admin-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: var(--accent-purple);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    /* ==========================================================================
       2. TOP SUMMARY CARDS
       ========================================================================== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .summary-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .summary-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* ==========================================================================
       3. CATEGORY AVAILABILITY TOGGLES
       ========================================================================== */
    .card-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-row-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cat-toggle-box {
      background: rgba(10, 15, 26, 0.5);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .cat-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Switch Style */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* ==========================================================================
       4. SEARCH & FILTERS TOOLBAR
       ========================================================================== */
    .toolbar-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    .filter-select {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    .filter-select option { background: #0f172a; color: white; }

    /* ==========================================================================
       5. APPLICATION CARDS STACK
       ========================================================================== */
    .app-card-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .user-profile-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .user-name-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-uid-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge-app-status {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-app-status.pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-app-status.approved { background: rgba(16, 185, 129, 0.15); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-app-status.rejected { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    .card-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: rgba(10, 15, 26, 0.5);
      padding: 10px;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
    }

    .meta-key { color: var(--text-muted); font-weight: 600; }
    .meta-val { font-weight: 700; color: var(--text-main); text-align: right; }

    .btn-action-row {
      display: flex;
      gap: 8px;
    }

    .btn-act {
      flex: 1;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .btn-view { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-approve { background: rgba(16, 185, 129, 0.15); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-reject { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    .btn-act:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ==========================================================================
       6. MODAL SYSTEM
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      padding: 16px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.8rem;
    }

    .detail-lbl { color: var(--text-muted); font-weight: 600; }
    .detail-val { font-weight: 700; color: var(--text-main); text-align: right; }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid rgba(139, 92, 246, 0.15);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <!-- Toast Notification System -->
  <div id="toast-container"></div>

  <!-- Loading Animation -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; font-weight:600; color:var(--text-muted);">Syncing Applications...</div>
  </div>

  <div class="admin-container">

    <!-- ADMIN HEADER -->
    <header class="admin-header">
      <div class="brand-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Main Admin
      </div>
      <span class="brand-badge">Sub Admin Approval</span>
    </header>

    <!-- TOP SUMMARY STATS -->
    <section class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Pending Apps</div>
        <div id="stat-pending" class="summary-value" style="color:var(--accent-gold);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Approved Today</div>
        <div id="stat-approved-today" class="summary-value" style="color:var(--primary);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Rejected Today</div>
        <div id="stat-rejected-today" class="summary-value" style="color:var(--danger);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Updates Requested</div>
        <div id="stat-updates-count" class="summary-value" style="color:var(--accent-purple);">0</div>
      </div>
    </section>

    <!-- CATEGORY AVAILABILITY TOGGLES -->
    <section class="card-block">
      <div class="section-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Category Control Toggles
      </div>

      <div class="toggle-row-grid">
        <div class="cat-toggle-box">
          <div class="cat-title">WhatsApp Admin</div>
          <label class="switch">
            <input type="checkbox" id="toggle-whatsapp" checked onchange="toggleCategoryAvailability('WhatsApp Admin', this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="cat-toggle-box">
          <div class="cat-title">Team Leader</div>
          <label class="switch">
            <input type="checkbox" id="toggle-team" checked onchange="toggleCategoryAvailability('Team Leader', this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <div class="cat-toggle-box">
          <div class="cat-title">Class Leader</div>
          <label class="switch">
            <input type="checkbox" id="toggle-class" checked onchange="toggleCategoryAvailability('Class Leader', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- TOOLBAR: SEARCH & FILTERS -->
    <section class="toolbar-card">
      <input type="text" id="search-input" class="search-input" placeholder="Search by Name, UID, WhatsApp, Role..." oninput="filterAndRenderApplications()">

      <div class="filter-row">
        <select id="status-filter" class="filter-select" onchange="filterAndRenderApplications()">
          <option value="all">All Statuses</option>
          <option value="Pending" selected>Pending</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>

        <select id="category-filter" class="filter-select" onchange="filterAndRenderApplications()">
          <option value="all">All Categories</option>
          <option value="WhatsApp Admin">WhatsApp Admin</option>
          <option value="Team Leader">Team Leader</option>
          <option value="Class Leader">Class Leader</option>
        </select>
      </div>
    </section>

    <!-- APPLICATION LIST STACK -->
    <section class="app-card-stack" id="applications-container">
      <!-- Dynamic Realtime Application Cards -->
    </section>

  </div> <!-- /admin-container -->

  <!-- VIEW APPLICATION DETAILS MODAL -->
  <div id="modal-view" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size:1rem; font-weight:800;">Application Details</h3>
        <button style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;" onclick="closeModal('modal-view')">&times;</button>
      </div>
      <div id="view-modal-content">
        <!-- Dynamic Details -->
      </div>
    </div>
  </div>

  <!-- REJECT APPLICATION REASON MODAL -->
  <div id="modal-reject" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size:1rem; font-weight:800; color:var(--danger);">Reject Application</h3>
        <button style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;" onclick="closeModal('modal-reject')">&times;</button>
      </div>

      <div style="margin-bottom:14px;">
        <label style="display:block; font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:6px;">Rejection Reason:</label>
        <textarea id="reject-reason-input" class="search-input" style="height:80px; resize:none;" placeholder="Enter rejection reason..."></textarea>
      </div>

      <div style="display:flex; gap:8px;">
        <button class="btn-act btn-reject" style="padding:10px;" onclick="confirmRejectApplication()">Confirm Rejection</button>
        <button style="background:rgba(255,255,255,0.05); color:white; border:1px solid var(--card-border); padding:10px; border-radius:var(--radius-sm); font-weight:700; flex:1;" onclick="closeModal('modal-reject')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT REALTIME ADMIN APPROVAL LOGIC -->
  <script>
    // ==========================================================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ==========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBFKWIm1kUaP47rsHtEEP05G66-SSRsvwA",
      authDomain: "gamil-sever.firebaseapp.com",
      databaseURL: "https://gamil-sever-default-rtdb.firebaseio.com",
      projectId: "gamil-sever",
      storageBucket: "gamil-sever.firebasestorage.app",
      messagingSenderId: "895391304528",
      appId: "1:895391304528:web:4b86c59ce3163607beba55"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allApplicationsList = [];
    let allUsersMap = {};
    let selectedAppId = null;

    const categorySettings = {
      'WhatsApp Admin': true,
      'Team Leader': true,
      'Class Leader': true
    };

    // ==========================================================================
    // 2. REALTIME DATABASE LISTENERS
    // ==========================================================================
    database.ref('settings/subAdminCategories').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        Object.assign(categorySettings, data);
        document.getElementById('toggle-whatsapp').checked = categorySettings['WhatsApp Admin'] !== false;
        document.getElementById('toggle-team').checked = categorySettings['Team Leader'] !== false;
        document.getElementById('toggle-class').checked = categorySettings['Class Leader'] !== false;
      }
    });

    database.ref('users').on('value', (snapshot) => {
      allUsersMap = snapshot.val() || {};
      filterAndRenderApplications();
    });

    database.ref('all_sub_admin_applications').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      allApplicationsList = Object.keys(data).map(key => ({
        appId: key,
        ...data[key]
      }));

      // Sort Newest First
      allApplicationsList.sort((a, b) => (b.applyTime || 0) - (a.applyTime || 0));

      calculateTopSummaryStats();
      filterAndRenderApplications();
      hideLoader();
    }, (error) => {
      showToast("Error loading database: " + error.message, "error");
      hideLoader();
    });

    // ==========================================================================
    // 3. TOP SUMMARY STATS CALCULATIONS
    // ==========================================================================
    function calculateTopSummaryStats() {
      let pendingCount = 0;
      let approvedToday = 0;
      let rejectedToday = 0;
      let updateRequestsCount = 0;

      const todayStr = new Date().toDateString();

      allApplicationsList.forEach(app => {
        if (app.status === 'Pending') pendingCount++;

        if (app.reviewTime && new Date(app.reviewTime).toDateString() === todayStr) {
          if (app.status === 'Approved') approvedToday++;
          if (app.status === 'Rejected') rejectedToday++;
        }

        // Check if user was already a Sub Admin (Position Update)
        const user = allUsersMap[app.authUid];
        if (user && user.isSubAdmin) {
          updateRequestsCount++;
        }
      });

      document.getElementById('stat-pending').textContent = pendingCount;
      document.getElementById('stat-approved-today').textContent = approvedToday;
      document.getElementById('stat-rejected-today').textContent = rejectedToday;
      document.getElementById('stat-updates-count').textContent = updateRequestsCount;
    }

    // ==========================================================================
    // 4. CATEGORY AVAILABILITY TOGGLE HANDLER
    // ==========================================================================
    async function toggleCategoryAvailability(categoryName, isChecked) {
      // Ensure at least 1 category stays ON
      const nextState = { ...categorySettings, [categoryName]: isChecked };
      const activeCount = Object.values(nextState).filter(Boolean).length;

      if (activeCount === 0) {
        showToast("System must never allow all three categories to be OFF.", "error");
        document.getElementById(`toggle-${categoryName === 'WhatsApp Admin' ? 'whatsapp' : categoryName === 'Team Leader' ? 'team' : 'class'}`).checked = true;
        return;
      }

      categorySettings[categoryName] = isChecked;

      try {
        await database.ref('settings/subAdminCategories').set(categorySettings);
        showToast(`Category '${categoryName}' set to ${isChecked ? 'ON' : 'OFF'}.`, "success");
        filterAndRenderApplications();
      } catch (err) {
        showToast("Error updating category toggle: " + err.message, "error");
      }
    }

    // ==========================================================================
    // 5. SEARCH & FILTER ENGINE
    // ==========================================================================
    function filterAndRenderApplications() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('status-filter').value;
      const catFilter = document.getElementById('category-filter').value;

      let filtered = [...allApplicationsList];

      if (searchTerm) {
        filtered = filtered.filter(a => 
          (a.userName && a.userName.toLowerCase().includes(searchTerm)) ||
          (a.uid && a.uid.toString().toLowerCase().includes(searchTerm)) ||
          (a.whatsapp && a.whatsapp.toLowerCase().includes(searchTerm)) ||
          (a.category && a.category.toLowerCase().includes(searchTerm))
        );
      }

      if (statusFilter !== 'all') {
        filtered = filtered.filter(a => a.status === statusFilter);
      }

      if (catFilter !== 'all') {
        filtered = filtered.filter(a => a.category === catFilter);
      }

      renderApplicationCards(filtered);
    }

    // ==========================================================================
    // 6. APPLICATION CARDS RENDERING & VALIDATION ENGINE
    // ==========================================================================
    function renderApplicationCards(list) {
      const container = document.getElementById('applications-container');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">No matching applications found.</div>`;
        return;
      }

      list.forEach(app => {
        const user = allUsersMap[app.authUid] || {};
        const activeRef = user.activeReferral || app.activeReferrals || 0;
        const currentRole = user.subAdminRole || 'None';
        const isCatAvailable = categorySettings[app.category] !== false;

        // Validation 1: Minimum 3 Active Referrals
        const isEligibleRef = activeRef >= 3;

        // Validation 2: 14 Day Position Change Lock
        let is14DayLocked = false;
        if (user.isSubAdmin && user.roleApprovedAt) {
          const daysPassed = (Date.now() - user.roleApprovedAt) / (1000 * 60 * 60 * 24);
          if (daysPassed < 14) is14DayLocked = true;
        }

        const canApprove = app.status === 'Pending' && isEligibleRef && !is14DayLocked && isCatAvailable;

        const card = document.createElement('div');
        card.className = 'app-item-card';

        const avatar = user.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(app.userName || 'User')}&background=8b5cf6&color=fff`;

        card.innerHTML = `
          <div class="card-top-row">
            <div class="user-profile-left">
              <img class="user-avatar" src="${avatar}" alt="Avatar">
              <div style="min-width:0;">
                <div class="user-name-title">${escapeHTML(app.userName || 'Applicant')}</div>
                <div class="user-uid-sub">UID: ${app.uid || '------'} | ${escapeHTML(app.whatsapp || 'No WA')}</div>
              </div>
            </div>
            <span class="badge-app-status ${app.status.toLowerCase()}">${app.status}</span>
          </div>

          <div class="card-meta-grid">
            <div><span class="meta-key">Requested Role:</span></div>
            <div class="meta-val" style="color:var(--accent-purple);">${app.category}</div>

            <div><span class="meta-key">Current Role:</span></div>
            <div class="meta-val">${currentRole}</div>

            <div><span class="meta-key">Active Referrals:</span></div>
            <div class="meta-val" style="color:${isEligibleRef ? 'var(--primary)' : 'var(--danger)'};">${activeRef} (Min 3)</div>

            <div><span class="meta-key">Category Status:</span></div>
            <div class="meta-val" style="color:${isCatAvailable ? 'var(--primary)' : 'var(--danger)'};">${isCatAvailable ? 'ON' : 'OFF'}</div>
          </div>

          <div class="btn-action-row">
            <button class="btn-act btn-view" onclick="openViewModal('${app.appId}')">View Details</button>
            ${app.status === 'Pending' ? `
              <button class="btn-act btn-approve" ${!canApprove ? 'disabled' : ''} onclick="approveApplication('${app.appId}')">
                Approve
              </button>
              <button class="btn-act btn-reject" onclick="openRejectModal('${app.appId}')">Reject</button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================================================
    // 7. APPROVAL TRANSACTION & TEAM UNLINKING LOGIC
    // ==========================================================================
    async function approveApplication(appId) {
      const app = allApplicationsList.find(a => a.appId === appId);
      if (!app) return;

      const user = allUsersMap[app.authUid] || {};
      const activeRef = user.activeReferral || app.activeReferrals || 0;

      if (activeRef < 3) {
        showToast("Not Eligible: User has less than 3 Active Referrals.", "error");
        return;
      }

      if (categorySettings[app.category] === false) {
        showToast("Cannot approve: Requested category is turned OFF by Admin.", "error");
        return;
      }

      if (confirm(`Confirm approval for ${app.userName} as ${app.category}?`)) {
        const now = Date.now();
        const updates = {};

        // 1. Update Application Status
        updates[`all_sub_admin_applications/${appId}/status`] = 'Approved';
        updates[`all_sub_admin_applications/${appId}/reviewTime`] = now;
        updates[`sub_admin_applications/${app.authUid}/status`] = 'Approved';
        updates[`sub_admin_applications/${app.authUid}/reviewTime`] = now;

        // 2. Update User Profile Role
        const oldRole = user.subAdminRole || '';
        updates[`users/${app.authUid}/isSubAdmin`] = true;
        updates[`users/${app.authUid}/subAdminRole`] = app.category;
        updates[`users/${app.authUid}/roleApprovedAt`] = now;

        // 3. Auto-Remove & Team Unlinking Logic
        // If user was a WhatsApp Admin and is promoted to Team Leader or Class Leader -> Remove from previous TL's team!
        if (oldRole === 'WhatsApp Admin' && (app.category === 'Team Leader' || app.category === 'Class Leader')) {
          updates[`users/${app.authUid}/assignedTeamLeader`] = null;
        }

        // 4. Send Notification
        const notifKey = database.ref(`notifications/${app.authUid}`).push().key;
        updates[`notifications/${app.authUid}/${notifKey}`] = {
          title: "Sub Admin Application Approved!",
          message: `Congratulations! Your application for ${app.category} has been approved by Main Admin. Access granted!`,
          timestamp: now
        };

        try {
          await database.ref().update(updates);
          showToast(`Application Approved! Role '${app.category}' assigned to ${app.userName}.`, "success");
        } catch (err) {
          showToast("Error approving application: " + err.message, "error");
        }
      }
    }

    // ==========================================================================
    // 8. REJECTION TRANSACTION
    // ==========================================================================
    function openRejectModal(appId) {
      selectedAppId = appId;
      document.getElementById('reject-reason-input').value = '';
      document.getElementById('modal-reject').classList.add('active');
    }

    async function confirmRejectApplication() {
      if (!selectedAppId) return;

      const app = allApplicationsList.find(a => a.appId === selectedAppId);
      if (!app) return;

      const reason = document.getElementById('reject-reason-input').value.trim() || 'Application criteria not met.';
      const now = Date.now();
      const updates = {};

      updates[`all_sub_admin_applications/${selectedAppId}/status`] = 'Rejected';
      updates[`all_sub_admin_applications/${selectedAppId}/reviewTime`] = now;
      updates[`all_sub_admin_applications/${selectedAppId}/rejectReason`] = reason;

      updates[`sub_admin_applications/${app.authUid}/status`] = 'Rejected';
      updates[`sub_admin_applications/${app.authUid}/reviewTime`] = now;
      updates[`sub_admin_applications/${app.authUid}/rejectReason`] = reason;

      // Send Notification
      const notifKey = database.ref(`notifications/${app.authUid}`).push().key;
      updates[`notifications/${app.authUid}/${notifKey}`] = {
        title: "Sub Admin Application Update",
        message: `Your application for ${app.category} was rejected. Reason: ${reason}`,
        timestamp: now
      };

      try {
        await database.ref().update(updates);
        closeModal('modal-reject');
        showToast("Application rejected.", "success");
      } catch (err) {
        showToast("Error rejecting application: " + err.message, "error");
      }
    }

    // ==========================================================================
    // 9. MODAL HELPERS
    // ==========================================================================
    function openViewModal(appId) {
      const app = allApplicationsList.find(a => a.appId === appId);
      if (!app) return;

      const user = allUsersMap[app.authUid] || {};
      const content = document.getElementById('view-modal-content');

      content.innerHTML = `
        <div class="detail-row"><span class="detail-lbl">Full Name:</span><span class="detail-val">${escapeHTML(app.userName || 'N/A')}</span></div>
        <div class="detail-row"><span class="detail-lbl">Numeric UID:</span><span class="detail-val" style="color:var(--accent-gold);">${app.uid || 'N/A'}</span></div>
        <div class="detail-row"><span class="detail-lbl">WhatsApp:</span><span class="detail-val">${escapeHTML(app.whatsapp || 'N/A')}</span></div>
        <div class="detail-row"><span class="detail-lbl">Email:</span><span class="detail-val">${escapeHTML(app.email || 'N/A')}</span></div>
        <div class="detail-row"><span class="detail-lbl">Gender:</span><span class="detail-val">${app.gender || 'N/A'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Active Referrals:</span><span class="detail-val" style="color:var(--primary);">${user.activeReferral || app.activeReferrals || 0}</span></div>
        <div class="detail-row"><span class="detail-lbl">Current Balance:</span><span class="detail-val">$${(user.balance || 0).toFixed(2)}</span></div>
        <div class="detail-row"><span class="detail-lbl">Current Role:</span><span class="detail-val">${user.subAdminRole || 'None'}</span></div>
        <div class="detail-row"><span class="detail-lbl">Requested Role:</span><span class="detail-val" style="color:var(--accent-purple);">${app.category}</span></div>
        <div class="detail-row"><span class="detail-lbl">Apply Time:</span><span class="detail-val">${app.applyTime ? new Date(app.applyTime).toLocaleString() : 'N/A'}</span></div>
        <div style="margin-top:12px;">
          <label class="detail-lbl" style="display:block; margin-bottom:4px;">Cover Letter Essay:</label>
          <div style="background:rgba(10,15,26,0.6); padding:10px; border-radius:8px; font-size:0.75rem; color:var(--text-muted); line-height:1.4;">
            ${escapeHTML(app.essayText || 'No essay provided.')}
          </div>
        </div>
      `;
      document.getElementById('modal-view').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const iconSvg = type === 'success' 
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;

      toast.innerHTML = `${iconSvg} <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideDown 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function hideLoader() {
      const loader = document.getElementById('loading-overlay');
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
