<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Main Admin - Master User Management</title>

  <!-- Google Fonts & Firebase Compatibility SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL STYLES & GLASSMORPHISM THEME
       ========================================================================== */
    :root {
      --bg-dark: #060911;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: rgba(255, 255, 255, 0.12);
      
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px;
      position: relative;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Ambient Background Glows */
    .glow-bg {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(16, 185, 129, 0.1); top: -80px; left: -80px; }
    .glow-2 { width: 350px; height: 350px; background: rgba(239, 68, 68, 0.08); bottom: -80px; right: -80px; }

    /* Admin Container */
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Toast Notification System */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      background: rgba(22, 30, 49, 0.96);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      pointer-events: auto;
      animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .toast.success { border-left: 4px solid var(--primary); }
    .toast.error { border-left: 4px solid var(--danger); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header Bar */
    .admin-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--primary);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    /* ==========================================================================
       2. TOP SUMMARY STATS
       ========================================================================== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 768px) {
      .summary-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .summary-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* ==========================================================================
       3. SEARCH, FILTERS & EXPORT TOOLBAR
       ========================================================================== */
    .toolbar-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .btn-export {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-blue);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    .filter-select {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    .filter-select option { background: #0f172a; color: white; }

    /* ==========================================================================
       4. USER TABLE / CARDS
       ========================================================================== */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    .admin-table th {
      background: rgba(30, 41, 59, 0.6);
      padding: 14px 16px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .admin-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
      white-space: nowrap;
    }

    .user-profile-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
    }

    .badge-status {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      display: inline-block;
    }

    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rejected { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-blocked { background: rgba(239, 68, 68, 0.25); color: white; border: 1px solid var(--danger); }

    .btn-act-group {
      display: flex;
      gap: 4px;
    }

    .btn-act {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.725rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-manage { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-danger-sm { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

    /* ==========================================================================
       5. MODALS (MANAGE / EDIT / DELETE)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      padding: 16px;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: all; }

    .modal-box {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .form-group { margin-bottom: 12px; }

    .form-label {
      display: block;
      font-size: 0.725rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .input-box, .select-box {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.825rem;
      outline: none;
    }

    .input-box[readonly] { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); cursor: not-allowed; }

    .btn-submit-primary {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Balance Action Grid Buttons */
    .bal-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-bal-act {
      padding: 8px;
      border-radius: var(--radius-sm);
      font-size: 0.725rem;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      cursor: pointer;
    }

    .btn-bal-act.selected { background: var(--primary); border-color: var(--primary); }

    /* Account Control Button Stack */
    .ctrl-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 3.5px solid rgba(16, 185, 129, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <!-- Toast Notification System -->
  <div id="toast-container"></div>

  <!-- Loading Animation -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; font-weight:600; color:var(--text-muted);">Syncing User Database...</div>
  </div>

  <div class="admin-container">

    <!-- ADMIN HEADER -->
    <header class="admin-header">
      <div class="brand-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Main Admin
      </div>
      <span class="brand-badge">User Management</span>
    </header>

    <!-- TOP SUMMARY STATS -->
    <section class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Total Users</div>
        <div id="stat-total" class="summary-value">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Active Members</div>
        <div id="stat-active" class="summary-value" style="color:var(--primary);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Pending Users</div>
        <div id="stat-pending" class="summary-value" style="color:var(--accent-gold);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Rejected Users</div>
        <div id="stat-rejected" class="summary-value" style="color:var(--danger);">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Blocked Users</div>
        <div id="stat-blocked" class="summary-value" style="color:var(--danger);">0</div>
      </div>
    </section>

    <!-- SEARCH & FILTERS TOOLBAR -->
    <section class="toolbar-card">
      <div class="search-row">
        <input type="text" id="search-input" class="search-input" placeholder="Search by UID, Ref Code, Name, WhatsApp, Email..." oninput="filterAndRenderUsers()">
        <button class="btn-export" onclick="exportUserListCSV()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV Export
        </button>
      </div>

      <div class="filter-row">
        <select id="status-filter" class="filter-select" onchange="filterAndRenderUsers()">
          <option value="all">All Statuses</option>
          <option value="active">Active Users</option>
          <option value="pending">Pending Users</option>
          <option value="Rejected">Rejected Users</option>
          <option value="blocked">Blocked Users</option>
        </select>

        <select id="sort-filter" class="filter-select" onchange="filterAndRenderUsers()">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="earnings">Highest Earnings</option>
        </select>
      </div>
    </section>

    <!-- USER DATA TABLE -->
    <section class="table-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>User</th>
              <th>UID / Ref Code</th>
              <th>WhatsApp / Email</th>
              <th>Balance / Earnings</th>
              <th>Referrals</th>
              <th>Sub Admin Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Dynamic Realtime Rows -->
          </tbody>
        </table>
        <div id="empty-table-msg" style="text-align:center; padding:30px; color:var(--text-muted); display:none;">
          No matching user records found.
        </div>
      </div>
    </section>

  </div> <!-- /admin-container -->

  <!-- MANAGE USER MODAL -->
  <div id="modal-manage" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size:1rem; font-weight:800;">Manage User Profile</h3>
        <button style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;" onclick="closeModal('modal-manage')">&times;</button>
      </div>

      <!-- User Basic Info Form -->
      <form id="form-edit-user" onsubmit="saveUserProfileEdits(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="edit-fullname" class="input-box" required>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select id="edit-gender" class="select-box">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Current Balance ($)</label>
            <input type="number" id="edit-balance" class="input-box" step="0.01">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">WhatsApp (Read Only)</label>
          <input type="text" id="read-whatsapp" class="input-box" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">Email (Read Only)</label>
          <input type="email" id="read-email" class="input-box" readonly>
        </div>

        <div class="form-group">
          <label class="form-label">UID (Read Only)</label>
          <input type="text" id="read-uid" class="input-box" readonly>
        </div>

        <button type="submit" class="btn-submit-primary">Save Profile Changes</button>
      </form>

      <!-- Balance Management Tools -->
      <div style="margin-top:16px; border-top:1px solid var(--card-border); padding-top:12px;">
        <label class="form-label">Direct Balance Control</label>
        <div class="bal-btn-grid">
          <button class="btn-bal-act selected" id="btn-mode-add" onclick="setBalMode('add', this)">Add (+)</button>
          <button class="btn-bal-act" id="btn-mode-deduct" onclick="setBalMode('deduct', this)">Deduct (-)</button>
          <button class="btn-bal-act" id="btn-mode-reset" onclick="setBalMode('reset', this)">Reset (0)</button>
        </div>
        <div class="form-group">
          <input type="number" id="bal-amount-input" class="input-box" placeholder="Enter amount..." step="1">
        </div>
        <button class="btn-submit-primary" style="background:var(--accent-blue);" onclick="executeBalanceAdjustment()">Execute Balance Change</button>
      </div>

      <!-- Account Controls & Cascading Delete -->
      <div style="margin-top:16px; border-top:1px solid var(--card-border); padding-top:12px;">
        <label class="form-label">Account Status Override</label>
        <div class="ctrl-btn-grid">
          <button class="btn-act" style="background:rgba(16,185,129,0.2); color:var(--primary);" onclick="updateAccountStatus('active')">Activate</button>
          <button class="btn-act" style="background:rgba(245,158,11,0.2); color:var(--accent-gold);" onclick="updateAccountStatus('pending')">Suspend</button>
          <button class="btn-act" style="background:rgba(239,68,68,0.2); color:var(--danger);" onclick="updateAccountStatus('blocked')">Block User</button>
        </div>

        <button class="btn-submit-primary" style="background:var(--danger); margin-top:14px;" onclick="confirmDeleteUserCascading()">
          Permanently Delete User Account
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT REALTIME MASTER USER MANAGEMENT LOGIC -->
  <script>
    // ==========================================================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ==========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBFKWIm1kUaP47rsHtEEP05G66-SSRsvwA",
      authDomain: "gamil-sever.firebaseapp.com",
      databaseURL: "https://gamil-sever-default-rtdb.firebaseio.com",
      projectId: "gamil-sever",
      storageBucket: "gamil-sever.firebasestorage.app",
      messagingSenderId: "895391304528",
      appId: "1:895391304528:web:4b86c59ce3163607beba55"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allUsersMap = {};
    let selectedAuthUid = null;
    let selectedBalMode = 'add';

    // ==========================================================================
    // 2. REALTIME DATABASE LISTENERS
    // ==========================================================================
    database.ref('users').on('value', (snapshot) => {
      allUsersMap = snapshot.val() || {};
      calculateTopSummaryStats();
      filterAndRenderUsers();
      hideLoader();
    }, (error) => {
      showToast("Error loading database: " + error.message, "error");
      hideLoader();
    });

    // ==========================================================================
    // 3. TOP SUMMARY STATS CALCULATIONS
    // ==========================================================================
    function calculateTopSummaryStats() {
      let total = 0, active = 0, pending = 0, rejected = 0, blocked = 0;

      Object.keys(allUsersMap).forEach(key => {
        const u = allUsersMap[key];
        total++;

        const status = u.accountStatus || 'pending';
        if (status === 'active') active++;
        else if (status === 'pending') pending++;
        else if (status === 'Rejected') rejected++;
        else if (status === 'blocked') blocked++;
      });

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-rejected').textContent = rejected;
      document.getElementById('stat-blocked').textContent = blocked;
    }

    // ==========================================================================
    // 4. INSTANT SEARCH & FILTER ENGINE
    // ==========================================================================
    function filterAndRenderUsers() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('status-filter').value;
      const sortFilter = document.getElementById('sort-filter').value;

      let userArray = Object.keys(allUsersMap).map(key => ({
        authUid: key,
        ...allUsersMap[key]
      }));

      // Search Filter
      if (searchTerm) {
        userArray = userArray.filter(u => 
          (u.uid && u.uid.toString().toLowerCase().includes(searchTerm)) ||
          (u.referralCode && u.referralCode.toString().toLowerCase().includes(searchTerm)) ||
          (u.name && u.name.toLowerCase().includes(searchTerm)) ||
          (u.whatsapp && u.whatsapp.toLowerCase().includes(searchTerm)) ||
          (u.email && u.email.toLowerCase().includes(searchTerm))
        );
      }

      // Status Filter
      if (statusFilter !== 'all') {
        userArray = userArray.filter(u => (u.accountStatus || 'pending') === statusFilter);
      }

      // Sorting
      userArray.sort((a, b) => {
        if (sortFilter === 'earnings') {
          return (b.totalEarnings || b.balance || 0) - (a.totalEarnings || a.balance || 0);
        }
        const timeA = a.createdAt || 0;
        const timeB = b.createdAt || 0;
        return sortFilter === 'newest' ? timeB - timeA : timeA - timeB;
      });

      renderUserTable(userArray);
    }

    function renderUserTable(userArray) {
      const tbody = document.getElementById('user-table-body');
      const emptyMsg = document.getElementById('empty-table-msg');
      tbody.innerHTML = '';

      if (userArray.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      userArray.forEach(u => {
        const tr = document.createElement('tr');
        const status = u.accountStatus || 'pending';

        let badgeClass = 'badge-pending';
        if (status === 'active') badgeClass = 'badge-active';
        else if (status === 'Rejected') badgeClass = 'badge-rejected';
        else if (status === 'blocked') badgeClass = 'badge-blocked';

        const avatar = u.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name || 'User')}&background=10b981&color=fff`;

        tr.innerHTML = `
          <td>
            <div class="user-profile-cell">
              <img class="user-avatar" src="${avatar}" alt="Avatar">
              <div>
                <div style="font-weight:700;">${escapeHTML(u.name || 'User')}</div>
                <div style="font-size:0.7rem; color:var(--text-muted);">${u.gender || 'N/A'}</div>
              </div>
            </div>
          </td>
          <td><span style="font-weight:700; color:var(--accent-gold);">${u.uid || u.referralCode || 'N/A'}</span></td>
          <td>
            <div>${escapeHTML(u.whatsapp || 'No WA')}</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">${escapeHTML(u.email || 'No Email')}</div>
          </td>
          <td>
            <div style="font-weight:800; color:var(--primary);">$${(u.balance || 0).toFixed(2)}</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">Earned: $${(u.totalEarnings || 0).toFixed(2)}</div>
          </td>
          <td><span style="font-weight:700; color:var(--accent-blue);">${u.activeReferral || 0} Active</span></td>
          <td>${u.subAdminRole ? `<span style="color:var(--accent-purple); font-weight:700;">${u.subAdminRole}</span>` : 'Member'}</td>
          <td><span class="badge-status ${badgeClass}">${status}</span></td>
          <td>
            <div class="btn-act-group">
              <button class="btn-act btn-manage" onclick="openManageModal('${u.authUid}')">Manage</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ==========================================================================
    // 5. MANAGE MODAL & PROFILE EDIT HANDLERS
    // ==========================================================================
    function openManageModal(authUid) {
      selectedAuthUid = authUid;
      const u = allUsersMap[authUid];
      if (!u) return;

      document.getElementById('edit-fullname').value = u.name || '';
      document.getElementById('edit-gender').value = u.gender || 'Male';
      document.getElementById('edit-balance').value = (u.balance || 0).toFixed(2);

      document.getElementById('read-whatsapp').value = u.whatsapp || 'N/A';
      document.getElementById('read-email').value = u.email || 'N/A';
      document.getElementById('read-uid').value = u.uid || 'N/A';

      document.getElementById('modal-manage').classList.add('active');
    }

    async function saveUserProfileEdits(event) {
      event.preventDefault();
      if (!selectedAuthUid) return;

      const newName = document.getElementById('edit-fullname').value.trim();
      const newGender = document.getElementById('edit-gender').value;
      const newBal = parseFloat(document.getElementById('edit-balance').value) || 0;

      try {
        await database.ref('users/' + selectedAuthUid).update({
          name: newName,
          gender: newGender,
          balance: newBal
        });

        showToast("Profile updated successfully!", "success");
        closeModal('modal-manage');
      } catch (err) {
        showToast("Error updating user: " + err.message, "error");
      }
    }

    // ==========================================================================
    // 6. DIRECT BALANCE CONTROL (ADD / DEDUCT / RESET)
    // ==========================================================================
    function setBalMode(mode, btnEl) {
      selectedBalMode = mode;
      document.querySelectorAll('.btn-bal-act').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    async function executeBalanceAdjustment() {
      if (!selectedAuthUid) return;

      const u = allUsersMap[selectedAuthUid];
      if (!u) return;

      const amountInput = parseFloat(document.getElementById('bal-amount-input').value) || 0;
      let currentBal = u.balance || 0;
      let newBal = currentBal;

      if (selectedBalMode === 'add') {
        newBal += amountInput;
      } else if (selectedBalMode === 'deduct') {
        newBal = Math.max(0, currentBal - amountInput);
      } else if (selectedBalMode === 'reset') {
        newBal = 0;
      }

      try {
        await database.ref(`users/${selectedAuthUid}/balance`).set(newBal);
        showToast(`Balance updated to $${newBal.toFixed(2)}`, "success");
        document.getElementById('edit-balance').value = newBal.toFixed(2);
      } catch (err) {
        showToast("Error updating balance: " + err.message, "error");
      }
    }

    // ==========================================================================
    // 7. ACCOUNT STATUS CONTROL & CASCADING DELETE
    // ==========================================================================
    async function updateAccountStatus(newStatus) {
      if (!selectedAuthUid) return;

      if (confirm(`Change user account status to '${newStatus.toUpperCase()}'?`)) {
        try {
          await database.ref(`users/${selectedAuthUid}/accountStatus`).set(newStatus);
          showToast(`User status set to ${newStatus.toUpperCase()}`, "success");
          closeModal('modal-manage');
        } catch (err) {
          showToast("Error setting status: " + err.message, "error");
        }
      }
    }

    async function confirmDeleteUserCascading() {
      if (!selectedAuthUid) return;

      if (confirm("WARNING: Are you sure you want to PERMANENTLY delete this user and all associated data? This cannot be undone!")) {
        const updates = {};
        updates[`users/${selectedAuthUid}`] = null;
        updates[`user_withdraws/${selectedAuthUid}`] = null;
        updates[`sub_admin_applications/${selectedAuthUid}`] = null;
        updates[`notifications/${selectedAuthUid}`] = null;

        try {
          await database.ref().update(updates);
          showToast("User account permanently deleted.", "success");
          closeModal('modal-manage');
        } catch (err) {
          showToast("Error deleting user: " + err.message, "error");
        }
      }
    }

    // ==========================================================================
    // 8. CSV EXPORT TOOL
    // ==========================================================================
    function exportUserListCSV() {
      let csvContent = "data:text/csv;charset=utf-8,Full Name,UID,WhatsApp,Email,Gender,Balance,Account Status\n";

      Object.keys(allUsersMap).forEach(key => {
        const u = allUsersMap[key];
        csvContent += `"${u.name || ''}","${u.uid || ''}","${u.whatsapp || ''}","${u.email || ''}","${u.gender || ''}","${u.balance || 0}","${u.accountStatus || ''}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "EarnPro_User_List.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ==========================================================================
    // 9. HELPER FUNCTIONS
    // ==========================================================================
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const iconSvg = type === 'success' 
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;

      toast.innerHTML = `${iconSvg} <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideDown 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function hideLoader() {
      const loader = document.getElementById('loading-overlay');
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
